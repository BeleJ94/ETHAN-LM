<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Mine à ciel ouvert au crépuscule, camion de livraison sur la piste d'accès (fond de la page de connexion) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B2238"/>
      <stop offset=".55" stop-color="#2B4F73"/>
      <stop offset=".82" stop-color="#C98A52"/>
      <stop offset="1" stop-color="#E7B57A"/>
    </linearGradient>
    <radialGradient id="sun" cx=".72" cy=".47" r=".35">
      <stop offset="0" stop-color="#FFD9A0" stop-opacity=".85"/>
      <stop offset=".4" stop-color="#F2B36F" stop-opacity=".35"/>
      <stop offset="1" stop-color="#F2B36F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A4434"/>
      <stop offset="1" stop-color="#2A211C"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7B57A" stop-opacity="0"/>
      <stop offset="1" stop-color="#E7B57A" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9C7A5A"/>
      <stop offset="1" stop-color="#6B523F"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>

  <!-- Collines lointaines -->
  <path d="M0 520 C160 470 300 500 430 465 C560 430 700 470 840 445 C1000 418 1130 455 1270 430 C1400 408 1500 440 1600 425 V620 H0Z" fill="#4E5B6B" opacity=".55"/>
  <path d="M0 560 C200 525 340 552 520 520 C700 490 860 530 1040 505 C1220 482 1400 515 1600 495 V650 H0Z" fill="#5C5049" opacity=".75"/>

  <!-- Chevalement et convoyeur (silhouettes) -->
  <g fill="#2E2A2A" opacity=".85">
    <path d="M1255 505 l18 -120 h10 l18 120 h-9 l-14 -98 l-14 98z"/>
    <rect x="1262" y="390" width="32" height="7"/>
    <circle cx="1278" cy="384" r="9" fill="none" stroke="#2E2A2A" stroke-width="4"/>
    <rect x="1305" y="455" width="70" height="50"/>
    <rect x="1385" y="470" width="44" height="35"/>
    <path d="M1300 470 L1160 520 L1166 526 L1304 478z"/>
    <rect x="1395" y="430" width="6" height="40"/>
  </g>

  <!-- Fosse : gradins successifs -->
  <path d="M120 600 C380 560 1080 560 1480 600 L1480 640 C1080 605 380 605 120 640Z" fill="#8A6A50"/>
  <path d="M120 640 C380 605 1080 605 1480 640 L1440 680 C1060 648 420 648 160 680Z" fill="#6E5440"/>
  <path d="M160 680 C420 648 1060 648 1440 680 L1390 722 C1030 692 460 692 210 722Z" fill="#8F6E52"/>
  <path d="M210 722 C460 692 1030 692 1390 722 L1330 762 C990 736 500 736 270 762Z" fill="#6A503D"/>
  <path d="M270 762 C500 736 990 736 1330 762 L1260 798 C950 778 540 778 340 798Z" fill="#87674C"/>
  <path d="M340 798 C540 778 950 778 1260 798 L1180 830 C900 816 590 816 420 830Z" fill="#5E4737"/>
  <ellipse cx="800" cy="842" rx="380" ry="22" fill="#3B5468" opacity=".8"/>
  <!-- Arêtes des gradins -->
  <g fill="none" stroke="#B08A68" stroke-width="2" opacity=".45">
    <path d="M120 640 C380 605 1080 605 1480 640"/>
    <path d="M160 680 C420 648 1060 648 1440 680"/>
    <path d="M210 722 C460 692 1030 692 1390 722"/>
    <path d="M270 762 C500 736 990 736 1330 762"/>
    <path d="M340 798 C540 778 950 778 1260 798"/>
  </g>
  <!-- Rampe descendant dans la fosse -->
  <path d="M1180 600 L1420 640 L1400 652 L1150 612Z M1395 680 L1170 652 L1150 662 L1370 694Z" fill="#A5835F" opacity=".7"/>

  <!-- Engins dans la fosse -->
  <g fill="#E0A23A">
    <path d="M610 742 h46 v-14 h16 l10 14 h6 v12 h-78z"/>
    <circle cx="624" cy="757" r="6" fill="#222"/><circle cx="676" cy="757" r="6" fill="#222"/>
    <path d="M905 704 h40 v-12 h14 l9 12 h5 v10 h-68z"/>
    <circle cx="917" cy="717" r="5" fill="#222"/><circle cx="962" cy="717" r="5" fill="#222"/>
  </g>

  <!-- Premier plan : terrain et piste d'accès -->
  <path d="M0 820 C300 800 520 830 760 860 C1000 890 1300 870 1600 840 V1000 H0Z" fill="url(#ground)"/>
  <path d="M-40 1000 C220 930 520 880 860 860 C1080 848 1240 830 1420 790 L1460 798 C1290 846 1110 872 880 888 C560 910 300 955 120 1000Z" fill="url(#road)"/>
  <path d="M60 1000 C300 942 560 898 870 876 C1100 860 1260 838 1440 795" fill="none" stroke="#D9C2A0" stroke-width="3" stroke-dasharray="26 22" opacity=".55"/>
  <rect y="760" width="1600" height="120" fill="url(#haze)"/>

  <!-- Camion de livraison (citerne) en approche -->
  <g transform="translate(1060 868) rotate(-9) scale(.78)">
    <rect x="0" y="-62" width="250" height="56" rx="26" fill="#C7D0D9"/>
    <rect x="0" y="-62" width="250" height="16" rx="8" fill="#E6EBF0" opacity=".8"/>
    <rect x="18" y="-8" width="220" height="10" fill="#3A3F45"/>
    <path d="M258 -54 h52 l26 30 v28 h-78z" fill="#1F4E79"/>
    <path d="M276 -48 h30 l18 22 h-48z" fill="#A9C6E2" opacity=".85"/>
    <rect x="252" y="-6" width="90" height="10" fill="#2A2F35"/>
    <g fill="#16181B">
      <circle cx="40" cy="8" r="15"/><circle cx="78" cy="8" r="15"/><circle cx="196" cy="8" r="15"/><circle cx="292" cy="8" r="15"/><circle cx="326" cy="8" r="15"/>
    </g>
    <g fill="#6C737B">
      <circle cx="40" cy="8" r="6"/><circle cx="78" cy="8" r="6"/><circle cx="196" cy="8" r="6"/><circle cx="292" cy="8" r="6"/><circle cx="326" cy="8" r="6"/>
    </g>
    <circle cx="340" cy="-14" r="5" fill="#FFE7B0"/>
  </g>
  <!-- Poussière soulevée -->
  <g fill="#D9B98F" opacity=".25">
    <ellipse cx="1010" cy="878" rx="80" ry="18"/><ellipse cx="940" cy="888" rx="62" ry="15"/><ellipse cx="880" cy="898" rx="48" ry="12"/>
  </g>

  <!-- Balises de piste -->
  <g fill="#E7EDF2" opacity=".7">
    <rect x="1010" y="842" width="4" height="24"/><rect x="1150" y="818" width="4" height="22"/><rect x="1290" y="792" width="3" height="20"/>
  </g>
  <g fill="#E05A3A" opacity=".8">
    <rect x="1010" y="842" width="4" height="6"/><rect x="1150" y="818" width="4" height="6"/><rect x="1290" y="792" width="3" height="5"/>
  </g>
</svg>
